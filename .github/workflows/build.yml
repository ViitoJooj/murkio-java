name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "25"]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Compile with every warning as an error and package
        run: mvn -B -ntp -DskipTests package

      - name: Check what the jar holds
        run: |
          jar tf target/murkio-identity-*.jar | tee "$RUNNER_TEMP/jar.txt"
          grep -q "com/murkio/identity/Murkio.class" "$RUNNER_TEMP/jar.txt"
          grep -q "com/murkio/identity/servlet/MurkioFilter.class" "$RUNNER_TEMP/jar.txt"
